<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#14F195">

<meta
name="description"
content="MySolWallet - Premium Solana Wallet">

<title>MySolWallet</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bip39-web@3.0.5/dist/index.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/ed25519-hd-key-browser/dist/index.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>

<style>

:root{

color-scheme:light;

--primary:#14F195;
--primary-dark:#10D985;

--secondary:#9945FF;

--bg:#F5F8FC;

--surface:#FFFFFF;

--glass:rgba(255,255,255,.68);

--border:rgba(15,23,42,.08);

--text:#111827;

--text2:#64748B;

--success:#16A34A;

--warning:#F59E0B;

--danger:#EF4444;

--radius:26px;

--blur:24px;

--shadow:
0 18px 60px rgba(15,23,42,.10);

--speed:.28s cubic-bezier(.22,.61,.36,1);

}

[data-theme="dark"]{

color-scheme:dark;

--bg:#090B11;

--surface:#141A24;

--glass:rgba(18,22,32,.72);

--border:rgba(255,255,255,.08);

--text:#F8FAFC;

--text2:#94A3B8;

--shadow:
0 24px 70px rgba(0,0,0,.45);

}

*{

margin:0;

padding:0;

box-sizing:border-box;

-webkit-tap-highlight-color:transparent;

}

html{

scroll-behavior:smooth;

}

body{

font-family:'Inter',sans-serif;

background:

radial-gradient(circle at top left,#9945ff22,transparent 35%),

radial-gradient(circle at top right,#14f19522,transparent 35%),

var(--bg);

color:var(--text);

min-height:100vh;

transition:all var(--speed);

overflow-x:hidden;

}

button{

font-family:inherit;

border:none;

outline:none;

cursor:pointer;

}

input,textarea{

font-family:inherit;

outline:none;

}

a{

text-decoration:none;

color:inherit;

}

img{

display:block;

max-width:100%;

}

.app{

max-width:480px;

margin:auto;

min-height:100vh;

padding:22px;

position:relative;

}

.glass{

background:var(--glass);

backdrop-filter:blur(var(--blur));

-webkit-backdrop-filter:blur(var(--blur));

border:1px solid var(--border);

border-radius:var(--radius);

box-shadow:var(--shadow);

}

.hidden{

display:none!important;

}

  .screen{

width:100%;

min-height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

animation:fadeUp .45s ease;

}

.logo-wrapper{

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

gap:18px;

}

.logo-circle{

width:88px;

height:88px;

border-radius:50%;

background:linear-gradient(
135deg,
#14F195,
#9945FF
);

display:flex;

align-items:center;

justify-content:center;

font-size:36px;

color:#fff;

box-shadow:
0 20px 60px rgba(20,241,149,.35);

}

.logo-wrapper h1{

font-size:34px;

font-weight:800;

}

.logo-wrapper p{

color:var(--text2);

}

.hero{

padding:32px;

text-align:center;

}

.hero-logo{

display:flex;

justify-content:center;

margin-bottom:28px;

}

.hero h2{

font-size:30px;

font-weight:800;

margin-bottom:14px;

}

.hero span{

color:var(--primary);

}

.hero p{

line-height:1.7;

color:var(--text2);

}

.action-group{

display:flex;

flex-direction:column;

gap:16px;

margin-top:34px;

}

.btn{

height:58px;

border-radius:18px;

font-size:16px;

font-weight:700;

display:flex;

align-items:center;

justify-content:center;

gap:12px;

transition:.25s;

}

.btn:active{

transform:scale(.98);

}

.btn-primary{

background:linear-gradient(
135deg,
#14F195,
#9945FF
);

color:white;

}

.btn-outline{

background:var(--glass);

backdrop-filter:blur(24px);

border:1px solid var(--border);

color:var(--text);

}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:none;

}

}

</style>

</head>
<body>
  <div class="app">

    <!-- ==========================
         SPLASH
    =========================== -->

    <section id="splashScreen"
        class="screen active">

        <div class="logo-wrapper">

            <div class="logo-circle">

                <i class="fa-solid fa-wallet"></i>

            </div>

            <h1>MySolWallet</h1>

            <p>
                Premium Solana Wallet
            </p>

        </div>

    </section>


    <!-- ==========================
         WELCOME
    =========================== -->

    <section
        id="welcomeScreen"
        class="screen hidden">

        <div class="hero glass">

            <div class="hero-logo">

                <div class="logo-circle">

                    <i class="fa-solid fa-wallet"></i>

                </div>

            </div>

            <h2>

                Welcome to

                <span>

                    MySolWallet

                </span>

            </h2>

            <p>

                Secure, fast and premium
                self-custody wallet for
                the Solana ecosystem.

            </p>

        </div>

        <div class="action-group">

            <button
                id="btnCreateWallet"
                class="btn btn-primary">

                <i class="fa-solid fa-plus"></i>

                Create Wallet

            </button>

            <button
                id="btnImportWallet"
                class="btn btn-outline">

                <i class="fa-solid fa-file-import"></i>

                Import Wallet

            </button>

        </div>

    </section>
  </div>
    <script>

setTimeout(()=>{

document
.getElementById("splashScreen")
.classList.add("hidden");

document
.getElementById("welcomeScreen")
.classList.remove("hidden");

},1800);

document
.getElementById("btnCreateWallet")
.onclick=()=>{

showCreateWallet();

};

document
.getElementById("btnImportWallet")
.onclick=()=>{

showImportWallet();

};

function showCreateWallet(){

// akan kita isi pada Part berikutnya

}

function showImportWallet(){

// akan kita isi pada Part berikutnya

}

</script>
</body>
</html>
